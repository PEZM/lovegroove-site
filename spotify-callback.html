<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back to Lovegroove</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF2E6">
<link rel="icon" href="lovegroove.png">
<style>
  :root { --cream: #FAF2E6; --ink: #24170F; --ink-soft: rgba(36, 23, 15, 0.62); --red: #E8212A; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream); color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center; padding: 24px 16px;
  }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: var(--ink-soft); margin: 0 0 20px; }
  a.button {
    display: inline-block; padding: 12px 22px; border-radius: 999px;
    background: var(--red); color: #fff; font-weight: 700; text-decoration: none;
  }
</style>
</head>
<body>
<main>
  <img src="lovegroove.png" alt="">
  <h1>Connecting Spotify…</h1>
  <p>If Lovegroove doesn't open by itself, tap below.</p>
  <a class="button" id="back" href="gramophile://spotify">Back to Lovegroove</a>
</main>
<script>
  // Spotify only redirects to HTTPS pages, so this page hands the sign-in
  // (a one-time code, useless without the secret kept in the app) straight
  // back to Lovegroove.
  const target = "gramophile://spotify" + location.search;
  document.getElementById("back").href = target;
  location.replace(target);
</script>
</body>
</html>
